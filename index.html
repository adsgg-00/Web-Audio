<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Audio Hand Tracking</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 隱藏滾動條 */
            background-color: #000;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #webcam {
            /* 不要使用 display: none，這會導致某些瀏覽器停止處理影片。 */
            /* 改用其他方式隱藏，同時確保影片仍在背景播放。 */
            position: absolute;
            top: -9999px;
            visibility: hidden;
        }
        #output_canvas {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保持影像比例，完整顯示 */
            transform: scaleX(-1); /* 水平翻轉，實現鏡像效果 */
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-family: sans-serif;
        }
        .controls label {
            margin-right: 10px;
        }
        .controls select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label for="synth-select">音色:</label>
        <select id="synth-select">
            <option value="Synth" selected>基本 (Synth)</option>
            <option value="FMSynth">金屬 (FM)</option>
            <option value="AMSynth">顫音 (AM)</option>
            <option value="DuoSynth">雙振盪 (Duo)</option>
        </select>
    </div>
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- 💡 關鍵：載入 MediaPipe Hands 相關的函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- ✨ 新增：載入 Tone.js，用於聲音合成 -->
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.min.js"></script>

    <!-- 💡 關鍵：JavaScript 必須放在 body 的最後面 -->
    <script src="script.js"></script>
</body>
</html>
